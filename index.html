<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity Web Player | Shadows Of The Forest</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="orientation-overlay">
      <h2>Please rotate your device</h2>
      <p>This game only works in landscape mode.</p>
    </div>

    <div id="interaction-overlay">
      <h2>Adjust your screen</h2>
      <p>Swipe up to hide your browser's navigation bar.</p>
      <button id="btn-start-game">Tap to Play!</button>
    </div>

    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Shadows Of The Forest</div>
      </div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Hack para escapar del iframe de Simva y usar la pantalla completa real
      function forceFullscreenSize() {
        var container = document.querySelector("#unity-container");
        if (container) {
          container.style.position = "fixed";
          container.style.top = "0px";
          container.style.left = "0px";
          container.style.width = "100vw";
          container.style.height = "100vh";
          container.style.zIndex = "99999";
        }
      }

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() { warningBanner.style.display = warningBanner.children.length ? 'block' : 'none'; }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() { warningBanner.removeChild(div); updateBannerVisibility(); }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Shadows-of-the-Forest-gh-pages.loader.js";
      var config = {
        arguments:[],
        dataUrl: buildUrl + "/Shadows-of-the-Forest-gh-pages.data",
        frameworkUrl: buildUrl + "/Shadows-of-the-Forest-gh-pages.framework.js",
        codeUrl: buildUrl + "/Shadows-of-the-Forest-gh-pages.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Team Pickled Strawberry",
        productName: "Shadows Of The Forest",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        matchWebGLToCanvasSize: false,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
        document.getElementById("interaction-overlay").style.display = "flex";
        window.addEventListener('load', forceFullscreenSize);
        window.addEventListener('resize', forceFullscreenSize);
      } else {
        canvas.style.width = "1920px";
        canvas.style.height = "1080px";
      }

      document.getElementById("btn-start-game").addEventListener("click", function() {
        forceFullscreenSize();
        document.getElementById("interaction-overlay").style.display = "none";
      });

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => { unityInstance.SetFullscreen(1); };
        }).catch((message) => { alert(message); });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
